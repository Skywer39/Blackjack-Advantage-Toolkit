# Publishes the web app to GitHub Pages.
#
# The app is a single self-contained HTML file: no build server, no bundler
# toolchain, no dependencies at runtime. The engine is regenerated and verified
# against the Python one before anything is deployed, so a stale or drifted
# bundle cannot reach the site.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[dev]" Pillow
      - name: Regenerate the browser engine's constants
        run: python -m tools.export_constants
      - name: Check the browser engine against the Python engine
        run: node web/tests/conformance.test.mjs
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check src tests tools
      - name: Build the app and its offline shell
        run: |
          python -m tools.make_icons
          python -m tools.build_web
      - name: Stage the site
        run: cp -r web/dist _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
