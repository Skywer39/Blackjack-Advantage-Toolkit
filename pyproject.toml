[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bjtoolkit"
version = "0.1.0"
description = "Bankroll, bet ramp and risk analysis for card counting, for any set of table rules"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.5", "typer>=0.9", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "Pillow>=10.0"]

[project.scripts]
bj = "bjtoolkit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." so tests can import tools/
# The Monte Carlo validation tests need long horizons to say anything, so they
# are opt-in: `pytest` stays fast, `pytest -m slow` runs the real validation.
addopts = "-m 'not slow'"
markers = ["slow: long-horizon Monte Carlo validation (minutes, not seconds)"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines are usually prose in docstrings
    "UP042",  # str+Enum is deliberate: pydantic and typer both rely on the
              # members being real strings, which StrEnum changes subtly
]
